<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Merxio Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html">Merxio Shop</a>
    <ul class="navbar-nav">
      <li><a href="orders.html">Мои заказы</a></li>
      <li id="admin-link" class="hidden"><a href="admin.html">Админ</a></li>
      <li><a href="#" onclick="logout()">Выйти</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>Каталог товаров</h1>
    <p>Выберите товары и добавьте в корзину</p>
  </div>

  <div class="filters">
    <input type="text" id="search" class="form-control"
           placeholder="Поиск по названию" oninput="loadProducts()">
    <input type="text" id="category" class="form-control"
           placeholder="Категория" oninput="loadProducts()">
    <input type="number" id="min_price" class="form-control"
           placeholder="Цена от" oninput="loadProducts()">
    <input type="number" id="max_price" class="form-control"
           placeholder="Цена до" oninput="loadProducts()">
    <select id="order_by" class="form-control" onchange="loadProducts()">
      <option value="name">По названию</option>
      <option value="price_asc">Цена: по возрастанию</option>
      <option value="price_desc">Цена: по убыванию</option>
      <option value="created_at">Сначала новые</option>
    </select>
  </div>

  <div class="layout-with-cart">
    <div>
      <div id="products" class="product-grid"></div>
    </div>

    <div class="cart-sidebar">
      <div class="card">
        <div class="flex-between" style="margin-bottom:16px">
          <strong>Корзина</strong>
          <button class="btn btn-sm" onclick="clearCart()">Очистить</button>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-total">
          <span>Итого</span>
          <span id="cart-total">0 ₽</span>
        </div>
        <button class="btn btn-primary btn-full" onclick="checkout()">
          Оформить заказ
        </button>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth();

  if (localStorage.getItem("is_admin") === "true") {
    document.getElementById("admin-link").classList.remove("hidden");
  }

  async function loadProducts() {
    const params = {};
    const search = document.getElementById("search").value.trim();
    const category = document.getElementById("category").value.trim();
    const min_price = document.getElementById("min_price").value;
    const max_price = document.getElementById("max_price").value;
    const order_by = document.getElementById("order_by").value;

    if (search) params.search = search;
    if (category) params.category = category;
    if (min_price) params.min_price = min_price;
    if (max_price) params.max_price = max_price;
    if (order_by) params.order_by = order_by;

    const products = await api.getProducts(params);
    const container = document.getElementById("products");

    if (!products.length) {
      container.innerHTML = '<p class="text-muted">Товары не найдены</p>';
      return;
    }

    container.innerHTML = products.map((p) => `
      <div class="product-card">
        <div class="product-card-category">${p.category || "Без категории"}</div>
        <div class="product-card-name">${p.name}</div>
        <div class="product-card-desc">${p.description || ""}</div>
        <div class="product-card-price">${p.price.toLocaleString()} ₽</div>
        <button class="btn btn-primary btn-sm"
                onclick="addToCart(${p.id})">
          В корзину
        </button>
      </div>
    `).join("");
  }

  async function loadCart() {
    const cart = await api.getCart();
    const container = document.getElementById("cart-items");

    if (!cart.items.length) {
      container.innerHTML = '<p class="text-muted">Корзина пуста</p>';
      document.getElementById("cart-total").textContent = "0 ₽";
      return;
    }

    container.innerHTML = cart.items.map((item) => `
      <div class="cart-item">
        <div>
          <div>${item.product.name}</div>
          <div class="text-muted">${item.product.price.toLocaleString()} ₽ × ${item.quantity}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-sm"
                  onclick="changeQty(${item.id}, ${item.quantity - 1})">−</button>
          <span>${item.quantity}</span>
          <button class="btn btn-sm"
                  onclick="changeQty(${item.id}, ${item.quantity + 1})">+</button>
          <button class="btn btn-sm btn-danger"
                  onclick="removeItem(${item.id})">×</button>
        </div>
      </div>
    `).join("");

    document.getElementById("cart-total").textContent =
      cart.total.toLocaleString() + " ₽";
  }

  async function addToCart(productId) {
    await api.addToCart([{ product_id: productId, quantity: 1 }]);
    loadCart();
  }

  async function changeQty(itemId, qty) {
    if (qty <= 0) {
      await api.removeCartItem(itemId);
    } else {
      await api.updateCartItem(itemId, qty);
    }
    loadCart();
  }

  async function removeItem(itemId) {
    await api.removeCartItem(itemId);
    loadCart();
  }

  async function clearCart() {
    await api.clearCart();
    loadCart();
  }

  async function checkout() {
    try {
      await api.checkout();
      alert("Заказ оформлен!");
      loadCart();
    } catch (e) {
      alert(e.message);
    }
  }

  loadProducts();
  loadCart();
</script>
</body>
</html>
